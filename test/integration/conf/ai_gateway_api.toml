# AI Gateway API 测试配置文件
# 使用 SQLite 本地数据库 + SkipTokenValidate

[Server]
ServerPort = 8199                    # 测试端口（实际使用随机端口）
GracefulTimeOutInMs = 5000
MonitorPort = -1                  # 禁用监控端口

[Loggers.access]
LogName = "access"
LogLevel = "DEBUG"
RotateWhen = "MIDNIGHT"
BackupCount = 1
Format = "[%D %T] [%L] [%S] %M"
StdOut = false

[Loggers.sql]
LogName = "sql"
LogLevel = "DEBUG"
RotateWhen = "MIDNIGHT"
BackupCount = 1
Format = "[%D %T] %M"
StdOut = false

[Loggers.exception]
LogName = "exception"
LogLevel = "DEBUG"
RotateWhen = "MIDNIGHT"
BackupCount = 7
Format = "[%D %T] [%L] [%S] %M"
StdOut = false

[Databases.bfe_db]
DBName  = "./data/test_ai_gateway.db"
Driver  = "sqlite-strip"
MaxOpenConns = 5                   # 防止连接池死锁
MaxIdleConns = 1
ConnMaxIdleTimeInMs = 500000
ConnMaxLifetimeInMs = 5000000

[Depends]
NavTreeFile = "${conf_dir}/nav_tree.toml"
I18nDir     = "${conf_dir}/i18n"

[RunTime]
SkipTokenValidate = true           # 跳过 Token 验证
RecordSQL = false                 # 关闭 SQL 日志
SessionExpireInDay = 10
StaticFilePath = "./data"
Debug = false
AIRouteInnerProductName = "AI_product"
DefaultAIInstancePoolName = "BFE.aipool"
DefaultAIClusterName = "BFE-AI_product.szyf"