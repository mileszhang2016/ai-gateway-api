# ---------------------------------
# AI GATEWAY API Config
[Server]
# server port
ServerPort = 8183
# server graceful exit timeout
GracefulTimeOutInMs = 5000
# monitor port, don't start monitor server if less than 0
MonitorPort = 8284

# ---------------------------------
# Logger Config
# access log config
[Loggers.access]
LogName     = "access"
LogLevel    = "INFO"
RotateWhen  = "MIDNIGHT"
BackupCount = 1
Format      = "[%D %T] [%L] [%S] %M"
StdOut      = false

# sql log, you can skip this config if RunTime.RecordSQL is false
[Loggers.sql]
LogName     = "sql"
LogLevel    = "INFO"
RotateWhen  = "MIDNIGHT"
BackupCount = 1
Format      = "[%D %T] %M"
StdOut      = false

# exception log, for panic and critical errors
[Loggers.exception]
LogName     = "exception"
LogLevel    = "ERROR"
RotateWhen  = "MIDNIGHT"
BackupCount = 7
Format      = "[%D %T] [%L] [%S] %M"
StdOut      = false

# ---------------------------------
# Database Config
# see https://github.com/go-sql-driver/mysql/blob/master/dsn.go#L37
[Databases.bfe_db]
DBName               = "open_bfe"
Addr                 = "127.0.0.1:3306"
Net                  = "tcp"
User                 = "{user}"
Passwd               = "{password}"
MultiStatements      = true
MaxAllowedPacket     = 67108864
ParseTime            = true
AllowNativePasswords = true

Driver              = "mysql"
MaxOpenConns        = 500
MaxIdleConns        = 100
ConnMaxIdleTimeInMs = 500000
ConnMaxLifetimeInMs = 5000000

# SQLite database config example
# see db_ddl_sqlite.sql for table creation
# [Databases.bfe_db]
# DBName               = "./data/ai_gateway.db"
# Driver               = "sqlite"
# MaxOpenConns         = 50
# MaxIdleConns         = 10
# ConnMaxIdleTimeInMs  = 500000
# ConnMaxLifetimeInMs  = 5000000


# ---------------------------------
# Dependence Config
[Depends]
# NavTreeFile path
NavTreeFile = "${conf_dir}/nav_tree.toml"
# i18n conf dir path
I18nDir = "${conf_dir}/i18n"
# dashboard icon
UIIcon = "https://raw.githubusercontent.com/bfenetworks/bfe/develop/docs/images/logo/icon/color/bfe-icon-color.svg"
# dashboard logo
UILogo = "https://raw.githubusercontent.com/bfenetworks/bfe/develop/docs/images/logo/horizontal/color/bfe-horizontal-color.png"


# ---------------------------------
# Runtime Config
[RunTime]
# you can use "Skip {role_name} as authorization header to access api server if open this optional
# eg: Headers[Authorization] = "Skip System"
# don't open it on production environment
SkipTokenValidate = false
# sql will be record to log file when this option be opend
RecordSQL = true
# how long use must login again
SessionExpireInDay = 10
# static file path, when dynamic router not be matched, static file will be return if found
StaticFilePath = "./static"
# debug info will be add to response when this option be opend
Debug = false
# support AI product name
AIRouteInnerProductName = "AI_product"

# default AI cluster name
DefaultAIClusterName = "BFE-AI_product.szyf"

# default EPP instance pool name (singleton, /epp-pool)
DefaultEPPInstancePoolName = "EPP.pool"
# EPP assignment reconciler period in seconds (default 30)
EPPReconcileIntervalSeconds = 30

[RedisConf]
# bns addr
Bns = "BFE.poc-redis-wx"

# ms
ConnectTimeout = 10
ReadTimeout = 5
WriteTimeout = 5
MaxIdle = 10

# ---------------------------------
# Report Query Config (optional)
# see design-docs/modifications/2026-09-15-report-query-api and
# db_ddl_report_mysql.sql. When [Report] is absent the report module is
# not assembled and /open-api/v1/report/* stay 404.
#
# 轻量形态（Backend="mysql"，本机 MySQL 报表库 + 进程内聚合/分区 JOB）：
# [Databases.report_db]
# Driver = "mysql"
# DBName = "bfe_report"
# Addr = "127.0.0.1:3306"
# User = "report_rw"
# Passwd = "******"
# MaxOpenConns = 20
# MaxIdleConns = 5
#
# [Report]
# Backend = "mysql"
# Datasource = "report_db"      # a [Databases.*] entry
# Database = ""                 # schema override for table names (optional)
# EnableAggregateJob = true     # minute aggregate job (detail -> bfe_ai_metrics_1m)
# AggregateIntervalSec = 60
# RetentionDays = 7             # detail retention (partition DROP / DELETE window)
# EnablePartitionMgmt = true    # partition management job (DELETE fallback)
#
# 标准形态（Backend="doris"，既有 Kafka -> Doris 链路；Doris 走 FE 的 MySQL
# 协议端口，不引入新客户端；需先完成 ai-gateway-observability 侧建表/升级，
# 见该仓 doris/docs/user/HOWTO.md）：
# [Databases.doris_db]
# Driver = "mysql"              # Doris FE MySQL-protocol port, not a new client
# DBName = "bfe_observability"
# Addr = "127.0.0.1:9030"       # Doris FE query_port
# User = "report_read"          # SELECT-only is sufficient
# Passwd = ""
# AllowNativePasswords = true   # 必须显式开启：mysql.Config.FormatDSN 会把零值
#                               # 序列化为 allowNativePasswords=false，Doris FE
#                               # 的 mysql_native_password 认证随即被拒绝
# MaxOpenConns = 20
# MaxIdleConns = 5
#
# [Report]
# Backend = "doris"
# Datasource = "doris_db"       # a [Databases.*] entry (doris: FE 9030)
# Database = ""                 # schema override for table names (optional)
# The three job options below only take effect with backend=mysql; with the
# doris backend they are inert either way (aggregation is maintained by the
# warehouse-side INSERT JOB, retention by the tables' dynamic_partition props):
# EnableAggregateJob = false
# AggregateIntervalSec = 60
# RetentionDays = 7
# EnablePartitionMgmt = false